schema_version: "1.1"
name: toggle-fire-whole-block
expected_outcome: |
  Explains that in WeaponCore's backend (ApiBackend ToggleWeaponFire / FireWeaponBurst) the allWeapons argument is not used and weaponId is only checked against the weapon count; both send a shoot request for the whole block through the component's ShootManager, so every weapon on the block fires. The parameters are not the problem; the API cannot fire a single weapon on a multi-weapon block.
